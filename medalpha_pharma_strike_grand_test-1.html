on": "A patient with Parkinson disease develops wearing-off fluctuations on levodopa. Which drug inhibits peripheral dopa decarboxylase and is given with levodopa?", "options": [{"value": "A", "label": "Carbidopa"}, {"value": "B", "label": "Selegiline"}, {"value": "C", "label": "Bromocriptine"}, {"value": "D", "label": "Amantadine"}], "correct": "A"}, {"id": "Q13", "question": "Which drug is used to treat levodopa-induced dyskinesia in Parkinson disease?", "options": [{"value": "A", "label": "Amantadine"}, {"value": "B", "label": "Benztropine"}, {"value": "C", "label": "Entacapone"}, {"value": "D", "label": "Pramipexole"}], "correct": "A"}, {"id": "Q14", "question": "A patient with Parkinson disease is taking levodopa/carbidopa. Which drug can prolong levodopa action by inhibiting COMT?", "options": [{"value": "A", "label": "Entacapone"}, {"value": "B", "label": "Selegiline"}, {"value": "C", "label": "Rasagiline"}, {"value": "D", "label": "Apomorphine"}], "correct": "A"}, {"id": "Q15", "question": "Which opioid is a partial μ-opioid receptor agonist with a ceiling effect on respiratory depression?", "options": [{"value": "A", "label": "Morphine"}, {"value": "B", "label": "Buprenorphine"}, {"value": "C", "label": "Fentanyl"}, {"value": "D", "label": "Methadone"}], "correct": "B"}, {"id": "Q16", "question": "A patient presents with opioid overdose, respiratory depression and pinpoint pupils. Which antidote should be administered?", "options": [{"value": "A", "label": "Flumazenil"}, {"value": "B", "label": "Naloxone"}, {"value": "C", "label": "N-acetylcysteine"}, {"value": "D", "label": "Atropine"}], "correct": "B"}, {"id": "Q17", "question": "Which opioid has a high risk of serotonin toxicity because of its serotonergic activity?", "options": [{"value": "A", "label": "Tramadol"}, {"value": "B", "label": "Morphine"}, {"value": "C", "label": "Buprenorphine"}, {"value": "D", "label": "Hydromorphone"}], "correct": "A"}, {"id": "Q18", "question": "Which local anesthetic is most strongly associated with cardiotoxicity, particularly after accidental intravascular injection?", "options": [{"value": "A", "label": "Lidocaine"}, {"value": "B", "label": "Bupivacaine"}, {"value": "C", "label": "Procaine"}, {"value": "D", "label": "Chloroprocaine"}], "correct": "B"}, {"id": "Q19", "question": "A patient develops seizures and cardiovascular toxicity after inadvertent systemic absorption of a local anesthetic. What is the specific rescue therapy used for severe local-anesthetic systemic toxicity?", "options": [{"value": "A", "label": "IV lipid emulsion"}, {"value": "B", "label": "IV vitamin K"}, {"value": "C", "label": "Protamine sulfate"}, {"value": "D", "label": "Methylene blue"}], "correct": "A"}, {"id": "Q20", "question": "Which drug is the classic antidote for paracetamol toxicity?", "options": [{"value": "A", "label": "Naloxone"}, {"value": "B", "label": "N-acetylcysteine"}, {"value": "C", "label": "Atropine"}, {"value": "D", "label": "Fomepizole"}], "correct": "B"}, {"id": "Q21", "question": "A patient with methanol poisoning is treated with fomepizole. What enzyme is being inhibited?", "options": [{"value": "A", "label": "Alcohol dehydrogenase"}, {"value": "B", "label": "Aldehyde dehydrogenase"}, {"value": "C", "label": "Xanthine oxidase"}, {"value": "D", "label": "Acetylcholinesterase"}], "correct": "A"}, {"id": "Q22", "question": "Which antidote is used for significant tricyclic antidepressant overdose with QRS widening?", "options": [{"value": "A", "label": "Sodium bicarbonate"}, {"value": "B", "label": "Calcium gluconate"}, {"value": "C", "label": "Protamine"}, {"value": "D", "label": "Pralidoxime"}], "correct": "A"}, {"id": "Q23", "question": "A patient on unfractionated heparin develops serious bleeding. Which drug specifically reverses heparin?", "options": [{"value": "A", "label": "Vitamin K"}, {"value": "B", "label": "Protamine sulfate"}, {"value": "C", "label": "Idarucizumab"}, {"value": "D", "label": "Andexanet alfa"}], "correct": "B"}, {"id": "Q24", "question": "Which antidote specifically binds and reverses dabigatran?", "options": [{"value": "A", "label": "Idarucizumab"}, {"value": "B", "label": "Protamine"}, {"value": "C", "label": "Vitamin K"}, {"value": "D", "label": "Atropine"}], "correct": "A"}, {"id": "Q25", "question": "A patient on warfarin has life-threatening bleeding requiring rapid reversal. Which combination is appropriate?", "options": [{"value": "A", "label": "Vitamin K plus 4-factor PCC"}, {"value": "B", "label": "Protamine plus vitamin K"}, {"value": "C", "label": "Idarucizumab plus PCC"}, {"value": "D", "label": "Atropine plus PCC"}], "correct": "A"}, {"id": "Q26", "question": "Which antiplatelet drug irreversibly inhibits platelet cyclooxygenase and decreases thromboxane A2 synthesis?", "options": [{"value": "A", "label": "Aspirin"}, {"value": "B", "label": "Clopidogrel"}, {"value": "C", "label": "Abciximab"}, {"value": "D", "label": "Dipyridamole"}], "correct": "A"}, {"id": "Q27", "question": "Clopidogrel produces its antiplatelet effect primarily by blocking which receptor?", "options": [{"value": "A", "label": "P2Y12 ADP receptor"}, {"value": "B", "label": "GPIIb/IIIa receptor"}, {"value": "C", "label": "Thromboxane receptor"}, {"value": "D", "label": "PAR-1 receptor"}], "correct": "A"}, {"id": "Q28", "question": "Which drug is a direct factor Xa inhibitor?", "options": [{"value": "A", "label": "Apixaban"}, {"value": "B", "label": "Dabigatran"}, {"value": "C", "label": "Warfarin"}, {"value": "D", "label": "Unfractionated heparin"}], "correct": "A"}, {"id": "Q29", "question": "Which anticoagulant is associated with heparin-induced thrombocytopenia?", "options": [{"value": "A", "label": "Unfractionated heparin"}, {"value": "B", "label": "Warfarin"}, {"value": "C", "label": "Dabigatran"}, {"value": "D", "label": "Apixaban"}], "correct": "A"}, {"id": "Q30", "question": "A patient with pheochromocytoma is being prepared for surgery. Which sequence of adrenergic blockade is recommended?", "options": [{"value": "A", "label": "Beta blockade before alpha blockade"}, {"value": "B", "label": "Alpha blockade before beta blockade"}, {"value": "C", "label": "Beta blockade alone"}, {"value": "D", "label": "Alpha blockade alone in every case"}], "correct": "B"}, {"id": "Q31", "question": "Which beta blocker is relatively nonselective and can precipitate bronchospasm in susceptible patients with asthma?", "options": [{"value": "A", "label": "Propranolol"}, {"value": "B", "label": "Atenolol"}, {"value": "C", "label": "Metoprolol"}, {"value": "D", "label": "Nebivolol"}], "correct": "A"}, {"id": "Q32", "question": "Which drug is a selective β2 agonist commonly used for rapid relief of bronchospasm?", "options": [{"value": "A", "label": "Salbutamol"}, {"value": "B", "label": "Propranolol"}, {"value": "C", "label": "Phenylephrine"}, {"value": "D", "label": "Prazosin"}], "correct": "A"}, {"id": "Q33", "question": "A patient with hypertension develops a persistent dry cough after starting an ACE inhibitor. Which alternative class avoids ACE-inhibitor bradykinin accumulation?", "options": [{"value": "A", "label": "Angiotensin receptor blocker"}, {"value": "B", "label": "Direct renin inhibitor"}, {"value": "C", "label": "Alpha-1 blocker"}, {"value": "D", "label": "Loop diuretic"}], "correct": "A"}, {"id": "Q34", "question": "Which adverse effect is particularly characteristic of spironolactone?", "options": [{"value": "A", "label": "Gynecomastia"}, {"value": "B", "label": "Ototoxicity"}, {"value": "C", "label": "Pulmonary fibrosis"}, {"value": "D", "label": "Severe hypoglycemia"}], "correct": "A"}, {"id": "Q35", "question": "A patient with hyperaldosteronism needs a potassium-sparing diuretic that directly blocks the mineralocorticoid receptor. Which drug is used?", "options": [{"value": "A", "label": "Spironolactone"}, {"value": "B", "label": "Amiloride"}, {"value": "C", "label": "Furosemide"}, {"value": "D", "label": "Hydrochlorothiazide"}], "correct": "A"}, {"id": "Q36", "question": "Which diuretic is most likely to cause hypercalcemia rather than calcium wasting?", "options": [{"value": "A", "label": "Hydrochlorothiazide"}, {"value": "B", "label": "Furosemide"}, {"value": "C", "label": "Mannitol"}, {"value": "D", "label": "Acetazolamide"}], "correct": "A"}, {"id": "Q37", "question": "A patient with acute pulmonary edema requires a rapidly acting loop diuretic. Which drug is appropriate?", "options": [{"value": "A", "label": "Furosemide"}, {"value": "B", "label": "Spironolactone"}, {"value": "C", "label": "Amiloride"}, {"value": "D", "label": "Hydrochlorothiazide"}], "correct": "A"}, {"id": "Q38", "question": "Which drug inhibits carbonic anhydrase and can be used to treat acute mountain sickness?", "options": [{"value": "A", "label": "Acetazolamide"}, {"value": "B", "label": "Mannitol"}, {"value": "C", "label": "Furosemide"}, {"value": "D", "label": "Tolvaptan"}], "correct": "A"}, {"id": "Q39", "question": "A patient with severe hyperkalemia has ECG changes. Which drug stabilizes the cardiac membrane without directly lowering serum potassium?", "options": [{"value": "A", "label": "IV calcium gluconate"}, {"value": "B", "label": "Insulin with glucose"}, {"value": "C", "label": "Sodium zirconium cyclosilicate"}, {"value": "D", "label": "Furosemide"}], "correct": "A"}, {"id": "Q40", "question": "Which insulin preparation has the most rapid onset among the following?", "options": [{"value": "A", "label": "Insulin lispro"}, {"value": "B", "label": "Regular insulin"}, {"value": "C", "label": "NPH insulin"}, {"value": "D", "label": "Insulin glargine"}], "correct": "A"}, {"id": "Q41", "question": "A patient with type 1 diabetes develops diabetic ketoacidosis. Which insulin is routinely used intravenously during treatment?", "options": [{"value": "A", "label": "Regular insulin"}, {"value": "B", "label": "NPH insulin"}, {"value": "C", "label": "Insulin glargine"}, {"value": "D", "label": "Insulin degludec"}], "correct": "A"}, {"id": "Q42", "question": "Which oral antidiabetic drug is most strongly associated with lactic acidosis in severe renal dysfunction and is generally withheld in significant renal impairment?", "options": [{"value": "A", "label": "Metformin"}, {"value": "B", "label": "Glimepiride"}, {"value": "C", "label": "Acarbose"}, {"value": "D", "label": "Sitagliptin"}], "correct": "A"}, {"id": "Q43", "question": "Which sulfonylurea adverse effect is most important clinically?", "options": [{"value": "A", "label": "Hypoglycemia"}, {"value": "B", "label": "Pulmonary fibrosis"}, {"value": "C", "label": "Ototoxicity"}, {"value": "D", "label": "Hypernatremia"}], "correct": "A"}, {"id": "Q44", "question": "Which drug class lowers blood glucose by increasing urinary glucose excretion through SGLT2 inhibition?", "options": [{"value": "A", "label": "Empagliflozin"}, {"value": "B", "label": "Sitagliptin"}, {"value": "C", "label": "Pioglitazone"}, {"value": "D", "label": "Repaglinide"}], "correct": "A"}, {"id": "Q45", "question": "A patient taking an SGLT2 inhibitor develops nausea, abdominal pain and metabolic acidosis with only modest hyperglycemia. Which diagnosis should be suspected?", "options": [{"value": "A", "label": "Euglycemic diabetic ketoacidosis"}, {"value": "B", "label": "Lactic acidosis from metformin"}, {"value": "C", "label": "Hyperosmolar hyperglycemic state"}, {"value": "D", "label": "Thyroid storm"}], "correct": "A"}, {"id": "Q46", "question": "Which glucocorticoid has strong anti-inflammatory activity with minimal mineralocorticoid effect?", "options": [{"value": "A", "label": "Dexamethasone"}, {"value": "B", "label": "Hydrocortisone"}, {"value": "C", "label": "Fludrocortisone"}, {"value": "D", "label": "Aldosterone"}], "correct": "A"}, {"id": "Q47", "question": "A patient receiving prolonged systemic glucocorticoid therapy should not have treatment stopped abruptly because of risk of which complication?", "options": [{"value": "A", "label": "Secondary adrenal insufficiency"}, {"value": "B", "label": "Acute hyperthyroidism"}, {"value": "C", "label": "Primary hyperaldosteronism"}, {"value": "D", "label": "Diabetes insipidus"}], "correct": "A"}, {"id": "Q48", "question": "Which drug is a selective estrogen receptor modulator used in the treatment of estrogen-receptor-positive breast cancer?", "options": [{"value": "A", "label": "Tamoxifen"}, {"value": "B", "label": "Letrozole"}, {"value": "C", "label": "Anastrozole"}, {"value": "D", "label": "Fulvestrant"}], "correct": "A"}, {"id": "Q49", "question": "Which drug is an aromatase inhibitor used in postmenopausal hormone-receptor-positive breast cancer?", "options": [{"value": "A", "label": "Anastrozole"}, {"value": "B", "label": "Tamoxifen"}, {"value": "C", "label": "Clomiphene"}, {"value": "D", "label": "Raloxifene"}], "correct": "A"}, {"id": "Q50", "question": "Which medication is a JAK inhibitor used in the treatment of rheumatoid arthritis?", "options": [{"value": "A", "label": "Tofacitinib"}, {"value": "B", "label": "Methotrexate"}, {"value": "C", "label": "Hydroxychloroquine"}, {"value": "D", "label": "Sulfasalazine"}], "correct": "A"}];
let idx=0, answers=Array(QUESTIONS.length).fill(null), submitted=false, seconds=50*60;
const quiz=document.getElementById('quiz'), counter=document.getElementById('counter'), progress=document.getElementById('progress'), timer=document.getElementById('timer');
function render(){
 const q=QUESTIONS[idx];
 quiz.innerHTML=`<div class="card"><div class="qnum">${q.id} / 50</div><div class="q">${q.question}</div>${q.options.map(o=>`<label class="opt"><input type="radio" name="q" value="${o.value}" ${answers[idx]===o.value?'checked':''}>${o.value}. ${o.label}</label>`).join('')}</div>`;
 quiz.querySelectorAll('input').forEach(x=>x.onchange=()=>{answers[idx]=x.value;update()});
 counter.textContent=`Question ${idx+1} of ${QUESTIONS.length}`;
 progress.style.width=`${((idx+1)/QUESTIONS.length)*100}%`;
 document.getElementById('prev').disabled=idx===0; document.getElementById('next').disabled=idx===QUESTIONS.length-1;
}
function update(){render()}
function tick(){if(submitted)return; seconds--; let m=Math.floor(seconds/60),s=seconds%60;timer.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; if(seconds<=0)submitTest(true)}
function submitTest(auto=false){
 if(submitted)return;
 if(!auto && !confirm('Submit the test now? Unanswered questions will receive 0 marks.'))return;
 submitted=true; clearInterval(clock);
 let correct=0,wrong=0,unanswered=0,score=0;
 answers.forEach((a,i)=>{if(!a)unanswered++; else if(a===QUESTIONS[i].correct){correct++;score+=4}else{wrong++;score-=1}});
 quiz.style.display='none'; document.querySelector('.nav').style.display='none';
 let r=document.getElementById('result'); r.style.display='block';
 r.innerHTML=`<div class="small">${auto?'Time expired — test auto-submitted.':'Test submitted.'}</div><div class="score">${score} / 200</div>
 <div class="grid"><div class="stat"><b>${correct}</b>Correct</div><div class="stat"><b>${wrong}</b>Wrong</div><div class="stat"><b>${unanswered}</b>Unanswered</div><div class="stat"><b>${((correct/50)*100).toFixed(1)}%</b>Accuracy</div></div>
 <h2>Answer Review</h2>${QUESTIONS.map((q,i)=>{
  const a=answers[i], ok=a===q.correct;
  return `<div class="review ${!a?'':' '+(ok?'correct':'wrong')}"><b>${i+1}. ${q.question}</b><p>Your answer: ${a||'Unanswered'} | Correct answer: ${q.correct}</p><p class="small">${q.options.find(o=>o.value===q.correct).label}</p></div>`;
 }).join('')}`;
 window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render()}};
document.getElementById('next').onclick=()=>{if(idx<49){idx++;render()}};
document.getElementById('submit').onclick=()=>submitTest(false);
render(); const clock=setInterval(tick,1000);
</script></body></html>
